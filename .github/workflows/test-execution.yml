name: Test Execution Agent

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  generated-regression-tests:
    name: Generated Regression Tests

    if: startsWith(github.head_ref, 'agent/fix-issue-')

    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Log pull request context
        run: |
          echo "========================================"
          echo "TEST EXECUTION AGENT"
          echo "========================================"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "PR number: ${{ github.event.pull_request.number }}"
          echo "Source branch: ${{ github.head_ref }}"
          echo "Target branch: ${{ github.base_ref }}"
          echo "Commit SHA: $GITHUB_SHA"
          echo "========================================"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify generated tests exist
        run: |
          echo "Generated Playwright tests:"

          if ! find tests/generated -name "*.spec.ts" -print -quit | grep -q .; then
            echo "ERROR: No generated regression tests found."
            exit 1
          fi

          find tests/generated -name "*.spec.ts" -print

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Preview configuration
        run: |
          echo "Pulling Vercel Preview configuration..."
          echo "Branch: ${{ github.head_ref }}"

          vercel pull \
            --yes \
            --environment=preview \
            --git-branch="${{ github.head_ref }}" \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel Preview
        run: |
          echo "Building Vercel Preview..."

          vercel build \
            --target=preview \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy Vercel Preview
        id: deploy
        run: |
          echo "Deploying Vercel Preview..."

          PREVIEW_URL=$(vercel deploy \
            --prebuilt \
            --token="${{ secrets.VERCEL_TOKEN }}")

          echo ""
          echo "========================================"
          echo "VERCEL PREVIEW DEPLOYMENT"
          echo "========================================"
          echo "Preview URL: $PREVIEW_URL"
          echo "Production URL is NOT used."
          echo "========================================"

          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BASE_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Wait for Preview environment
        run: |
          echo "Waiting for Preview environment..."
          echo "Target URL: $PLAYWRIGHT_BASE_URL"

          for i in {1..24}; do
            STATUS=$(curl \
              --silent \
              --location \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$PLAYWRIGHT_BASE_URL" || true)

            echo "Attempt $i: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Preview environment is ready."
              exit 0
            fi

            sleep 5
          done

          echo "ERROR: Preview environment did not become ready."
          exit 1

      - name: Log Playwright target
        run: |
          echo "========================================"
          echo "PLAYWRIGHT TEST TARGET"
          echo "========================================"
          echo "Environment: Vercel Preview"
          echo "URL: $PLAYWRIGHT_BASE_URL"
          echo "Branch: ${{ github.head_ref }}"
          echo "PR: #${{ github.event.pull_request.number }}"
          echo "========================================"

      - name: Run generated regression tests
        run: |
          echo "Running Playwright tests against:"
          echo "$PLAYWRIGHT_BASE_URL"

          npx playwright test tests/generated

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.event.pull_request.number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
