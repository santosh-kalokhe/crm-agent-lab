name: Test Execution Agent

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  generated-regression-tests:
    name: Generated Regression Tests

    if: startsWith(github.head_ref, 'agent/fix-issue-')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify generated tests exist
        run: |
          if ! find tests/generated -name "*.spec.ts" -print -quit | grep -q .; then
            echo "No generated regression tests found."
            exit 1
          fi

      - name: Build application
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Preview environment
        run: |
          vercel pull \
            --yes \
            --environment=preview \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel Preview
        run: |
          vercel build \
            --target=preview \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy Vercel Preview
        id: deploy
        run: |
          PREVIEW_URL=$(vercel deploy \
            --prebuilt \
            --target=preview \
            --token="${{ secrets.VERCEL_TOKEN }}")

          echo "Preview URL: $PREVIEW_URL"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BASE_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Verify Preview URL
        run: |
          echo "Playwright target: $PLAYWRIGHT_BASE_URL"

          if [ -z "$PLAYWRIGHT_BASE_URL" ]; then
            echo "PLAYWRIGHT_BASE_URL is empty."
            exit 1
          fi

      - name: Configure Vercel authentication
        run: |
          mkdir -p "$HOME/.local/share/com.vercel.cli"

          cat > "$HOME/.local/share/com.vercel.cli/auth.json" <<EOF
          {
            "token": "${{ secrets.VERCEL_TOKEN }}"
          }
          EOF

      - name: Wait for Vercel Preview
        run: |
          echo "Waiting for protected Vercel Preview: $PLAYWRIGHT_BASE_URL"

          for i in {1..12}; do
            if vercel curl "$PLAYWRIGHT_BASE_URL" \
              --silent \
              --fail \
              --output /dev/null; then

              echo "Vercel Preview is ready."
              exit 0
            fi

            echo "Attempt $i: Preview not ready yet."
            sleep 5
          done

          echo "Vercel Preview did not become ready."
          exit 1

      - name: Run generated regression tests
        run: |
          echo "Running Playwright against: $PLAYWRIGHT_BASE_URL"
          npx playwright test tests/generated

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.event.pull_request.number }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
