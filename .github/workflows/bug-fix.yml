name: Bug Fix Agent

on:
  repository_dispatch:
    types: [bug-analysis-complete]

  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  fix-bug:
    name: Generate Bug Fix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "Bug Fix Agent"
          git config user.email "bug-fix-agent@users.noreply.github.com"

      - name: Determine issue number
        id: issue
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "number=${{ github.event.client_payload.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Get issue details
        id: issue-details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title')
          ISSUE_BODY=$(gh issue view "$ISSUE_NUMBER" --json body --jq '.body')

          {
            echo "title<<EOF"
            echo "$ISSUE_TITLE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "body<<EOF"
            echo "$ISSUE_BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Bug Fix Agent
        run: npx tsx scripts/bug-fix.ts
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue-details.outputs.title }}
          ISSUE_BODY: ${{ steps.issue-details.outputs.body }}
          REPOSITORY: ${{ github.repository }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY_RUN: "false"
