name: Bug Analysis Agent
run-name: "Bug Analysis Agent Bug #${{ github.event.issue.number }} — ${{ github.event.issue.title }}"
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  analyze-bug:
    name: Analyze New Bug
    runs-on: ubuntu-latest

    # Only run for issues created by our CRM bug-report workflow
    if: contains(github.event.issue.labels.*.name, 'agent-created')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run Bug Analysis Agent
        run: npx tsx scripts/bug-analysis.ts
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REPOSITORY: ${{ github.repository }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Trigger Bug Fix Agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/dispatches \
            -f event_type='bug-analysis-complete' \
            -F client_payload[issue_number]=${{ github.event.issue.number }}
